<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bronco Car Mining</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans pb-20">

    <!-- Header -->
    <div class="flex justify-between items-center p-4 border-b border-gray-800">
        <h1 class="text-xl font-bold flex items-center gap-2">🚗 BRONCO</h1>
        <div class="flex gap-2">
            <span class="bg-gray-800 px-3 py-1 rounded-full text-sm">EN</span>
        </div>
    </div>

    <!-- Balance Card -->
    <div class="p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg">
            <p class="text-gray-400 text-sm">YOUR BALANCE</p>
            <h2 class="text-3xl font-extrabold mt-1">$<span id="balance">0.00</span> <span class="text-sm font-normal text-gray-400">USD</span></h2>
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-800">
                <span class="text-xs text-gray-400">⚡ $0.15 / day</span>
                <button onclick="collectEarnings()" class="bg-blue-600 hover:bg-blue-500 text-xs px-4 py-2 rounded-xl font-medium">Collect all</button>
            </div>
        </div>
    </div>

    <!-- Car Collection List -->
    <div class="px-4">
        <h3 class="text-lg font-bold mb-3">Car collection</h3>
        <div class="grid grid-cols-2 gap-4">
            <!-- Item 1 -->
            <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl">
                <span class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-gray-300">Common</span>
                <h4 class="font-bold mt-2 text-sm">Terragon</h4>
                <p class="text-xs text-gray-400 mt-1">Income: $0.15/d</p>
                <p class="text-sm font-bold mt-2">$1.00</p>
                <button class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded-lg font-medium">Activate</button>
            </div>
            <!-- Item 2 -->
            <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl">
                <span class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-gray-300">Common</span>
                <h4 class="font-bold mt-2 text-sm">Verdant</h4>
                <p class="text-xs text-gray-400 mt-1">Income: $1.00/d</p>
                <p class="text-sm font-bold mt-2">$3.00</p>
                <button class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded-lg font-medium">Activate</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 flex justify-around p-3 text-xs">
        <button class="flex flex-col items-center text-blue-400">🚗 Miners</button>
        <button class="flex flex-col items-center text-gray-400">📋 Tasks</button>
        <button class="flex flex-col items-center text-gray-400">👛 Wallet</button>
        <button class="flex flex-col items-center text-gray-400">👥 Friends</button>
    </div>

    <script>
        // Telegram Web App Initialization
        let tg = window.Telegram.WebApp;
        tg.expand();

        function collectEarnings() {
            alert("Earnings collected successfully!");
        }
    </script>
</body>
</html>
