<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mining App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .close-btn {
            font-size: 16px;
            cursor: pointer;
            color: #a0a0b8;
        }

        .container {
            padding: 0 16px;
            flex: 1;
        }

        /* Tab Content Control */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0 10px 0;
        }

        /* Vault Card */
        .vault-card {
            background: linear-gradient(135deg, #1ad682 0%, #0d7a5b 100%);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 20px rgba(26, 214, 130, 0.2);
            overflow: hidden;
        }

        .vault-card::after {
            content: 'V';
            position: absolute;
            right: -10px;
            top: -20px;
            font-size: 140px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.1);
        }

        .card-label {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #e0ffe9;
            margin-bottom: 10px;
        }

        .main-balance {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coin-icon {
            width: 36px;
            height: 36px;
            background: #ffb703;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            border: 2px solid #fff;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
        }

        .usd-value {
            font-size: 14px;
            color: #d0edd7;
            margin-top: 2px;
        }

        .level-badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
        }

        .vault-stats {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-title {
            font-size: 11px;
            color: #b0e5c3;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-amount {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .stat-usd {
            font-size: 11px;
            color: #a0d4b3;
            float: right;
        }

        /* Wallet Cards */
        .wallet-card, .verify-card, .info-card {
            background: #191635;
            border-radius: 16px;
            padding: 16px;
            margin-top: 15px;
        }

        .wallet-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wallet-icon {
            width: 44px;
            height: 44px;
            background: #2ab6f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .wallet-address {
            font-size: 14px;
            color: #a0a0c0;
            margin-top: 2px;
        }

        .action-btn {
            background: #252148;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
        }

        .verify-header {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .shield-icon {
            width: 44px;
            height: 44px;
            background: #ffb703;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
        }

        .verify-title {
            font-size: 16px;
            font-weight: bold;
        }

        .verify-sub {
            font-size: 12px;
            color: #8a8aa8;
            margin-top: 2px;
        }

        .task-item {
            background: #120f29;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .check-icon {
            width: 24px;
            height: 24px;
            background: #1ad682;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #000;
        }

        /* Mine Screen Styling */
        .mine-display {
            text-align: center;
            margin: 40px 0;
        }

        .big-coin {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ffb703 0%, #fb8500 100%);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .big-coin:active {
            transform: scale(0.95);
        }

        .big-coin i {
            font-size: 60px;
            color: #fff;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: #13102b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1f1b40;
            padding: 0 10px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6c6c8a;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item.mine-btn {
            position: relative;
            top: -15px;
        }

        .mine-circle {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
            border: 4px solid #0d0b21;
        }

        .mine-circle i {
            font-size: 26px;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="close-btn"><i class="fa-solid fa-xmark"></i> Close</span>
        <span class="close-btn"><i class="fa-solid fa-ellipsis-vertical"></i></span>
    </div>

    <div class="container">
        <!-- 1. TASKS TAB -->
        <div id="tab-tasks" class="tab-content">
            <div class="section-title">Tasks</div>
            <div class="info-card">
                <h3>Daily Tasks</h3>
                <p style="color: #8a8aa8; margin-top: 5px;">Complete tasks to earn extra rewards.</p>
                
                <div class="task-item">
                    <div>
                        <div style="font-weight: bold;">Join Telegram Channel</div>
                        <div style="font-size: 12px; color: #1ad682;">+500 Coins</div>
                    </div>
                    <button class="action-btn"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <div class="task-item">
                    <div>
                        <div style="font-weight: bold;">Invite 3 Friends</div>
                        <div style="font-size: 12px; color: #1ad682;">+1000 Coins</div>
                    </div>
                    <button class="action-btn"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

        <!-- 2. MINERS TAB -->
        <div id="tab-miners" class="tab-content">
            <div class="section-title">Miners</div>
            <div class="info-card">
                <h3>Upgrade Miners</h3>
                <p style="color: #8a8aa8; margin-top: 5px;">Increase your mining rate per hour.</p>
                
                <div class="task-item">
                    <div>
                        <div style="font-weight: bold;">Basic Pickaxe</div>
                        <div style="font-size: 12px; color: #ffb703;">+10/hr (Cost: 100)</div>
                    </div>
                    <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <!-- 3. MINE TAB -->
        <div id="tab-mine" class="tab-content">
            <div class="section-title" style="text-align: center;">Mining Pool</div>
            <div class="mine-display">
                <h1 id="mine-balance" style="font-size: 40px;">1,114.88</h1>
                <p style="color: #a0a0c0;">Tap to mine coins</p>
                
                <div class="big-coin" onclick="tapCoin()">
                    <i class="fa-solid fa-pickaxe"></i>
                </div>
            </div>
